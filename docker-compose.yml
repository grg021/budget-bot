services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    restart: unless-stopped
    environment:
      # the one-time migration sync (~93k messages) exceeds the ~20MB defaults
      - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=200
      - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=200
      - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=200
    volumes:
      - actual-data:/data
    # Not exposed publicly; Caddy proxies to it.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      - ACTUAL_SERVER_URL=http://actual_server:5006
    volumes:
      - bot-data:/data
      - ./import:/import:ro
    depends_on:
      - actual_server

volumes:
  actual-data:
  caddy-data:
  caddy-config:
  bot-data:
